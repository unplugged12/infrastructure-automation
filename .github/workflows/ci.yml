name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A newer push to a pull request replaces the run in progress. Runs on the
# default branch, scheduled runs and manual runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; a job that needs more asks for it.
permissions:
  contents: read

jobs:
  powershell-lint:
    name: PowerShell Linting
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint PowerShell Scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path "powershell","scripts" -Filter "*.ps1" -Recurse | ForEach-Object {
            $results = Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error
            if ($results) {
              $errors += $results
            }
          }
          if ($errors.Count -gt 0) {
            $errors | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)"
            exit 1
          }

  bash-lint:
    name: Bash Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint Bash Scripts
        run: |
          set -euo pipefail
          find bash scripts -name "*.sh" -type f -print0 | xargs -0 -r shellcheck --severity=error

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Gitleaks comments on the pull request line where it finds a secret.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-scripts:
    name: Validate Script Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate PowerShell Syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path "powershell","scripts" -Filter "*.ps1" -Recurse | ForEach-Object {
            try {
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $_.FullName -Raw), [ref]$null)
              Write-Host "✓ $($_.Name)" -ForegroundColor Green
            } catch {
              Write-Error "✗ $($_.Name): $_"
              exit 1
            }
          }

      - name: Validate Bash Syntax
        run: |
          find bash scripts -name "*.sh" -type f -exec bash -n {} \;

  documentation-check:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check README exists
        run: |
          test -f README.md || (echo "README.md missing" && exit 1)
          test -f LICENSE || (echo "LICENSE missing" && exit 1)
          test -f SECURITY.md || (echo "SECURITY.md missing" && exit 1)
          test -f CONTRIBUTING.md || (echo "CONTRIBUTING.md missing" && exit 1)

      - name: Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'

  sql-lint:
    name: SQL Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install sqlfluff
        run: |
          python -m pip install --upgrade pip
          pip install sqlfluff==3.0.7

      - name: Lint SQL files
        run: |
          set -euo pipefail
          if find sql -name "*.sql" -type f -print -quit | grep -q .; then
            sqlfluff lint sql
          else
            echo "No SQL files detected, skipping lint."
          fi

  powershell-tests:
    name: PowerShell Tests
    runs-on: windows-latest
    needs: [powershell-lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester -ErrorAction Ignore | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0

          $tests = Get-ChildItem -Path powershell -Filter *.Tests.ps1 -Recurse
          if (-not $tests) {
            Write-Host "No Pester test files found. Skipping suite."
            exit 0
          }

          $resultsPath = Join-Path $PWD 'TestResults'
          New-Item -Path $resultsPath -ItemType Directory -Force | Out-Null

          $config = New-PesterConfiguration
          $config.Run.Path = @($tests.FullName)
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = Join-Path $resultsPath 'PesterResults.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'

          Invoke-Pester -Configuration $config
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish Pester results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-results
          path: TestResults/PesterResults.xml
          retention-days: 14
  placeholder-check:
    name: Check for Sanitization Placeholders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Placeholders Present
        run: |
          set -euo pipefail

          # Ensure no hardcoded password literal is assigned in the onboarding
          # scripts. They must prompt securely at runtime (Read-Host -AsSecureString),
          # never embed a credential string.
          if grep -RnE '\$([A-Za-z_]*Password[A-Za-z_]*)\s*=\s*"[^"]+"' powershell/; then
            echo "ERROR: Hardcoded password literal found in PowerShell scripts"
            exit 1
          fi

          # The onboarding scripts must request the password interactively.
          if ! grep -Rq "Read-Host.*-AsSecureString" powershell/user-management/; then
            echo "ERROR: Onboarding scripts no longer prompt securely for a password"
            exit 1
          fi

          if ! grep -R "<YOUR_" bash/ > /dev/null; then
            echo "ERROR: Network placeholders missing from Bash scripts"
            exit 1
          fi

          # Fail if any actual company references remain
          if grep -Rni "trojan" . --exclude-dir=.git --exclude-dir=.github; then
            echo "ERROR: Found unsanitized company references"
            exit 1
          fi
